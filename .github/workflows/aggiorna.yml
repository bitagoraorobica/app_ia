name: Aggiorna AI Compass

on:
  schedule:
    - cron: "0 5 * * *"  # ogni giorno alle 05:00 UTC (07:00 con l'ora legale, 06:00 con l'ora solare)
  workflow_dispatch:      # avvio manuale da Actions → "Run workflow"
  push:
    branches: [main]
    paths:
      - data/voci_manuali.csv
      - aggiorna_feed.py
      - generate_html.py
      - requirements.txt
      - logo.png
      - .github/workflows/aggiorna.yml

concurrency:
  group: aggiorna-ai-compass
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Raccolta feed e generazione pagina
        run: python aggiorna_feed.py

      - name: Salva feed, pagina e link già visti nel repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add ai-compass-feed.json index.html data/already_seen.txt
          if git diff --cached --quiet; then
            echo "Nessuna novità da salvare."
          else
            git commit -m "Aggiornamento automatico $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Prepara i file del sito
        run: |
          mkdir _site
          cp index.html ai-compass-feed.json logo.png _site/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  pubblica:
    needs: aggiorna
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
