<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>AI Compass – BitAgorà Orobica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #eef1f5;
      padding: 1em;
      margin: 0;
      transition: background 0.3s, color 0.3s;
    }
    body.dark {
      background: #181818;
      color: #e0e0e0;
    }
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2em;
      text-align: center;
    }
    header h1 {
      font-size: 2em;
      margin: 0.5em 0;
    }
    header img {
      max-width: 100%;
      height: auto;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1em;
      justify-content: center;
      margin-bottom: 2em;
    }
    .controls input,
    .controls select,
    .controls button {
      font-size: 1em;
      padding: 0.5em;
      flex: 1 1 200px;
      max-width: 300px;
      border: 1px solid #ccc;
      border-radius: 6px;
      transition: border 0.3s;
    }
    .controls input:hover,
    .controls select:hover {
      border-color: #007acc;
    }
    .entry {
      background: #ffffff;
      border-radius: 12px;
      padding: 1em;
      margin-bottom: 1.5em;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      border-left: 4px solid transparent;
    }
    .entry[data-category="News"] {
      border-left-color: #007acc;
    }
    .entry[data-category="Paper"] {
      border-left-color: #e67e22;
    }
    .entry[data-category="Course"] {
      border-left-color: #27ae60;
    }
    .entry[data-category="Automation"] {
      border-left-color: #9b59b6; /* viola brillante */
    }
    body.dark .entry {
      background: #1e1e1e;
    }
    .entry .title {
      font-size: 1.2em;
      font-weight: bold;
      color: #007acc;
      text-decoration: none;
      display: block;
      margin-bottom: 0.5em;
    }
    body.dark .title {
      color: #4fc3f7;
    }
    .entry p {
      margin: 0.5em 0;
      line-height: 1.4;
    }
    .entry .meta {
      font-size: 0.85em;
      color: #666;
      margin-top: 0.5em;
    }
    body.dark .meta {
      color: #aaa;
    }
    .entry .badge {
      margin-right: 0.5em;
      font-size: 1.2em;
    }
    @media (max-width: 600px) {
      .controls {
        flex-direction: column;
        align-items: stretch;
      }
      .controls input,
      .controls select,
      .controls button {
        flex: 1 1 auto;
        max-width: 100%;
      }
    }
    
    .entries-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5em;
    }
    @media (min-width: 700px) {
  .entries-grid {
    grid-template-columns: 1fr 1fr;
  }
}
@media (min-width: 1000px) {
  .entries-grid {
    grid-template-columns: 1fr 1fr 1fr;
  }
}
.entry {
  transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.5s ease;
  opacity: 0;
}
.entry.show {
  opacity: 1;
}
.entry:hover {
  transform: scale(1.02);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
}
  
    }
  </style>
</head>
<body>
  <header>
    <h1>AI Compass</h1>
    <img src="logo.png" alt="Logo">
  </header>
  <p><em>Selezione curata da <a href="https://www.bitagoraorobica.it" target="_blank">BitAgorà Orobica srl</a></em></p>

  <div class="controls">
    <input type="text" id="search" placeholder="Cerca per titolo o descrizione...">
    <select id="category">
      <option value="">Tutte le categorie</option>
      <option value="News">News</option>
      <option value="Paper">Paper</option>
      <option value="Course">Course</option>
      <option value="Automation">Automation</option>
    </select>
    <select id="source">
      <option value="">Tutte le fonti</option>
      <option value="BitAgorà Orobica">BitAgorà Orobica</option>
      <option value="OpenAI">OpenAI</option>
      <option value="YouTube - Gabry Solutions">YouTube - Gabry Solutions</option>
      <option value="YouTube – DeepMind">YouTube – DeepMind</option>
      <option value="YouTube – Raffaele Gaito">YouTube – Raffaele Gaito</option>
      <option value="arXiv AI">arXiv AI</option>
    </select>
    <select id="days">
      <option value="">Qualsiasi data</option>
      <option value="7">Ultimi 7 giorni</option>
      <option value="15">Ultimi 15 giorni</option>
      <option value="30">Ultimi 30 giorni</option>
    </select>
    <button id="toggleDark">🌗 Modalità scura</button>
    <button id="resetFilters">🔄 Reset filtri</button>
  </div>

  <div id="entries" class="entries-grid"></div>


  <script>
    const entryData = [{"date":"2026-10-02","title":"Measuring the Microtask Eligibility Gap: When Is an Off-the-Shelf SLM Enough for an Agent Harness?","description":"arXiv:2610.00025v1 Announce Type: new \nAbstract: Agent harnesses increasingly want to run small language models (SLMs) on the microtasks around a frontier large language model (LLM) planner: auto-approving shell commands, writing memory, selecting tools, ranking past turns. We ask whether off-the-sh","category":"Paper","link":"https://arxiv.org/abs/2610.00025","source":"arXiv AI","badge":"📜"},{"date":"2026-10-02","title":"Gradient-Aligned Pair Selection for Personalized Preference Optimization","description":"arXiv:2610.00061v1 Announce Type: new \nAbstract: Personalizing large language models (LLMs) requires aligning generation behavior with user-specific preferences rather than aggregate quality. While Direct Preference Optimization (DPO) provides a stable framework for preference learning, its effectiv","category":"Paper","link":"https://arxiv.org/abs/2610.00061","source":"arXiv AI","badge":"📜"},{"date":"2026-10-02","title":"Build2SPARQL: A Large-Scale Text-to-SPARQL Benchmark Dataset for Building Knowledge Graph Querying","description":"arXiv:2610.00224v1 Announce Type: new \nAbstract: Building automation systems are increasingly represented as semantic knowledge graphs (KGs) using ontologies such as Brick and ASHRAE 223P, creating a machine-readable substrate for artificial-intelligence applications. One promising application is tr","category":"Paper","link":"https://arxiv.org/abs/2610.00224","source":"arXiv AI","badge":"📜"},{"date":"2026-10-02","title":"Benchmarking Prompt Optimization of Large Language Models With Chess","description":"arXiv:2610.00416v1 Announce Type: new \nAbstract: Evaluating large language models becomes increasingly challenging as their capabilities advance: benchmarks can saturate, public test sets risk contamination, and assessing harder tasks can require expensive grading or execution infrastructure. These ","category":"Paper","link":"https://arxiv.org/abs/2610.00416","source":"arXiv AI","badge":"📜"},{"date":"2026-10-02","title":"JevSpawn: Adaptive Agentic Inference through Compositional Action Spaces","description":"arXiv:2610.00437v1 Announce Type: new \nAbstract: LLM agents generate intermediate reasoning and actions token by token, making extended interactions slow and computationally expensive. Jev-style models offer fast probabilistic predictions over finite fields, but require those fields to be specified ","category":"Paper","link":"https://arxiv.org/abs/2610.00437","source":"arXiv AI","badge":"📜"},{"date":"2026-10-02","title":"Ho chiesto a ChatGPT di scrivere una pagina del mio romanzo","description":"Clip estratta dall'intervista fatta ad Armando Bisogno su What’s Next, il podcast su tecnologia e innovazione raccontati, con un tocco umano, da chi li vive ogni giorno.\n\nGuarda l'intervista completa: https://www.youtube.com/watch?v=4VpAuIZK5Rg #short","category":"News","link":"https://www.youtube.com/shorts/xBDA048ykaM","source":"YouTube – Raffaele Gaito","badge":"🔥"},{"date":"2026-10-02","title":"Come, quando e perché torniamo sulla Luna [Adrian Fartade]","description":"Compra il mio corso base \"Crea un Agente AI con Claude Code\": https://www.raffaelegaito.com/claude-code-crea-agente-ai-corso-completo/?landing=true \n\nCompra il mio corso intermedio “Fai il passo successivo con Claude Code”: https://www.raffaelegaito.com/corso-claude-code-passo-successivo/?landing=tr","category":"News","link":"https://www.youtube.com/watch?v=N0HvO_CQdfo","source":"YouTube – Raffaele Gaito","badge":"🔥"},{"date":"2026-10-01","title":"How Albertsons Companies is reimagining retail from the inside out","description":"Albertsons Cos. is using ChatGPT Enterprise and the OpenAI API to help teams work faster and make grocery shopping easier for millions of customers.","category":"News","link":"https://openai.com/index/albertsons-reimagining-retail","source":"OpenAI","badge":"🔥"},{"date":"2026-10-01","title":"From deepfakes to DNA: the science of watermarking AI","description":"How do you know if what you're seeing is real? Professor Hannah Fry sits down with Pushmeet Kohli (VP of Science) and Jeremy Ratcliffe (Research Scientist) to break down SynthID, the watermarking technology expanding from text, images, and video straight into biology. Learn how invisible, mathematic","category":"News","link":"https://www.youtube.com/watch?v=HIUzrxQxTtw","source":"YouTube – DeepMind","badge":"🔥"},{"date":"2026-10-01","title":"Due persone con lo stesso strumento AI otterranno lo stesso risultato?","description":"Due persone con lo stesso strumento AI otterranno lo stesso risultato? \n\nA parità di tecnologia o di intelligenza artificiale, la differenza la fa chi c'è dietro. Non è questione di quale strumento usi, ma di come lo usi e di cosa ci metti dentro in termini di competenza e visione.\n\nClip estratta da","category":"News","link":"https://www.youtube.com/shorts/GiofiXWm9Ms","source":"YouTube – Raffaele Gaito","badge":"🔥"},{"date":"2026-10-01","title":"Trailer Adrian Fartade","description":"🚀 Spazio, tecnologia, robot, intellitenza artificiale\n\nUna nuova puntata scoppiettante di What's Next perfetta per gli amanti della scienza, della tecnologia e dello spazio.\n\nÈ stato mio ospite Adrian Fartade, divulgatore e creator, con cui mi sono fatto una bellissima chiacchierata.\n\nAbbiamo fatto ","category":"News","link":"https://www.youtube.com/shorts/lCUqQUWENRc","source":"YouTube – Raffaele Gaito","badge":"🔥"},{"date":"2026-10-01","title":"Come diventare pericolosamente intelligente (leggendo con l’AI)","description":"Come diventare pericolosamente intelligente (leggendo con l’AI) e Come leggere con l’AI per ricordare ciò che leggi e trasformarlo in idee da usare? Ti mostro il metodo PRIME: 5 mosse per leggere meglio con l’intelligenza artificiale, senza delegarle il tuo pensiero.\n\nLeggi tanti libri, sottolinei e","category":"News","link":"https://www.youtube.com/watch?v=L7fQg59qOPc","source":"YouTube - Gabry Solutions","badge":"🔥"},{"date":"2025-07-30","title":"Newsletter BitAgora","description":"Selezione articoli IA","category":"Tool","link":"https://newsletter.bitagoraorobica.it/tag/ia/","source":"BitAgorà Orobica","badge":""}];

    const searchInput = document.getElementById('search');
    const categoryFilter = document.getElementById('category');
    const sourceFilter = document.getElementById('source');
    const daysFilter = document.getElementById('days');
    const toggleDark = document.getElementById('toggleDark');
    const resetFilters = document.getElementById('resetFilters');
    const entriesDiv = document.getElementById('entries');

    function createEntry(item) {
      const div = document.createElement('div');
      div.className = 'entry';
      div.dataset.text = (item.title + ' ' + item.description).toLowerCase();
      div.dataset.category = item.category;
      div.dataset.source = item.source;
      div.dataset.date = item.date;
      div.innerHTML = `
        <a href="${item.link}" class="title" target="_blank">
          <span class="badge">${item.badge}</span>${item.title}
        </a>
        <p>${item.description}</p>
        <div class="meta">${item.source} – ${item.date} – ${item.category}</div>
      `;
      return div;
    }

    function render() {
      const q = searchInput.value.toLowerCase();
      const cat = categoryFilter.value;
      const src = sourceFilter.value;
      const days = parseInt(daysFilter.value);
      const now = new Date();

      entriesDiv.innerHTML = "";
entryData.forEach(item => {
  const entryDate = new Date(item.date);
  const diffDays = (now - entryDate) / (1000 * 60 * 60 * 24);
  if (
    (!q || (item.title + item.description).toLowerCase().includes(q)) &&
    (!cat || item.category === cat) &&
    (!src || item.source === src) &&
    (isNaN(days) || diffDays <= days)
  ) {
    const el = createEntry(item);
    entriesDiv.appendChild(el);
    // trigger animazione
    requestAnimationFrame(() => el.classList.add("show"));
  }
});

      
      
    }

    resetFilters.addEventListener("click", () => {
      searchInput.value = "";
      categoryFilter.value = "";
      sourceFilter.value = "";
      daysFilter.value = "";
      render();
    });

    searchInput.addEventListener("input", render);
    categoryFilter.addEventListener("change", render);
    sourceFilter.addEventListener("change", render);
    daysFilter.addEventListener("change", render);
    toggleDark.addEventListener("click", () => document.body.classList.toggle("dark"));

    render();
  </script>
</body>
</html>
