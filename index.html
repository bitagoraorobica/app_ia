<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>AI Compass – BitAgorà Orobica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #eef1f5;
      padding: 1em;
      margin: 0;
      transition: background 0.3s, color 0.3s;
    }
    body.dark {
      background: #181818;
      color: #e0e0e0;
    }
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2em;
      text-align: center;
    }
    header h1 {
      font-size: 2em;
      margin: 0.5em 0;
    }
    header img {
      max-width: 100%;
      height: auto;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1em;
      justify-content: center;
      margin-bottom: 2em;
    }
    .controls input,
    .controls select,
    .controls button {
      font-size: 1em;
      padding: 0.5em;
      flex: 1 1 200px;
      max-width: 300px;
      border: 1px solid #ccc;
      border-radius: 6px;
      transition: border 0.3s;
    }
    .controls input:hover,
    .controls select:hover {
      border-color: #007acc;
    }
    .entry {
      background: #ffffff;
      border-radius: 12px;
      padding: 1em;
      margin-bottom: 1.5em;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      border-left: 4px solid transparent;
    }
    .entry[data-category="News"] {
      border-left-color: #007acc;
    }
    .entry[data-category="Paper"] {
      border-left-color: #e67e22;
    }
    .entry[data-category="Course"] {
      border-left-color: #27ae60;
    }
    .entry[data-category="Automation"] {
      border-left-color: #9b59b6; /* viola brillante */
    }
    body.dark .entry {
      background: #1e1e1e;
    }
    .entry .title {
      font-size: 1.2em;
      font-weight: bold;
      color: #007acc;
      text-decoration: none;
      display: block;
      margin-bottom: 0.5em;
    }
    body.dark .title {
      color: #4fc3f7;
    }
    .entry p {
      margin: 0.5em 0;
      line-height: 1.4;
    }
    .entry .meta {
      font-size: 0.85em;
      color: #666;
      margin-top: 0.5em;
    }
    body.dark .meta {
      color: #aaa;
    }
    .entry .badge {
      margin-right: 0.5em;
      font-size: 1.2em;
    }
    @media (max-width: 600px) {
      .controls {
        flex-direction: column;
        align-items: stretch;
      }
      .controls input,
      .controls select,
      .controls button {
        flex: 1 1 auto;
        max-width: 100%;
      }
    }
    
    .entries-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5em;
    }
    @media (min-width: 700px) {
  .entries-grid {
    grid-template-columns: 1fr 1fr;
  }
}
@media (min-width: 1000px) {
  .entries-grid {
    grid-template-columns: 1fr 1fr 1fr;
  }
}
.entry {
  transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.5s ease;
  opacity: 0;
}
.entry.show {
  opacity: 1;
}
.entry:hover {
  transform: scale(1.02);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
}
  
    }
  </style>
</head>
<body>
  <header>
    <h1>AI Compass</h1>
    <img src="logo.png" alt="Logo">
  </header>
  <p><em>Selezione curata da <a href="https://www.bitagoraorobica.it" target="_blank">BitAgorà Orobica srl</a></em></p>

  <div class="controls">
    <input type="text" id="search" placeholder="Cerca per titolo o descrizione...">
    <select id="category">
      <option value="">Tutte le categorie</option>
      <option value="News">News</option>
      <option value="Paper">Paper</option>
      <option value="Course">Course</option>
      <option value="Automation">Automation</option>
    </select>
    <select id="source">
      <option value="">Tutte le fonti</option>
      <option value="BitAgorà Orobica">BitAgorà Orobica</option>
      <option value="OpenAI">OpenAI</option>
      <option value="YouTube - Gabry Solutions">YouTube - Gabry Solutions</option>
      <option value="YouTube – OpenAI">YouTube – OpenAI</option>
      <option value="arXiv AI">arXiv AI</option>
    </select>
    <select id="days">
      <option value="">Qualsiasi data</option>
      <option value="7">Ultimi 7 giorni</option>
      <option value="15">Ultimi 15 giorni</option>
      <option value="30">Ultimi 30 giorni</option>
    </select>
    <button id="toggleDark">🌗 Modalità scura</button>
    <button id="resetFilters">🔄 Reset filtri</button>
  </div>

  <div id="entries" class="entries-grid"></div>


  <script>
    const entryData = [{"date":"2026-09-18","title":"BioPhys-Bridge: A Benchmark for Interdisciplinary Scientific Reasoning in Physics-Grounded Biological Research","description":"arXiv:2609.19180v1 Announce Type: new \nAbstract: Language models face unique challenges in analyzing interdisciplinary scientific research literature. In biophysics research, faithful answers require grounding observed data in source evidence, interpreting it through a quantitative physics model, an","category":"Paper","link":"https://arxiv.org/abs/2609.19180","source":"arXiv AI","badge":"📜"},{"date":"2026-09-18","title":"What Do We Expect from LLMs? Mapping the Design of LLM Benchmarks","description":"arXiv:2609.19182v1 Announce Type: new \nAbstract: Benchmarks are central to how progress in large language models (LLMs) is assessed and communicated. Yet model rankings alone reveal little about how evaluation requirements themselves are changing. The expanding variety of benchmarks offers another p","category":"Paper","link":"https://arxiv.org/abs/2609.19182","source":"arXiv AI","badge":"📜"},{"date":"2026-09-18","title":"Characterizing Web Search by Conversational LLM Agents: From Search Decisions and Strategies to Results and Responses","description":"arXiv:2609.19244v1 Announce Type: new \nAbstract: Conversational LLM agents increasingly rely on Web search, yet the end-to-end lifecycle of agentic search remains poorly understood. We present the first study of Web search across four major conversational platforms (ChatGPT, Claude, Grok, and DeepSe","category":"Paper","link":"https://arxiv.org/abs/2609.19244","source":"arXiv AI","badge":"📜"},{"date":"2026-09-18","title":"MAGS: Multi-agent Auto-formalization Guarantees Safety for Agentic Outputs","description":"arXiv:2609.19391v1 Announce Type: new \nAbstract: LLM coding agents now generate complex programs at a scale that makes thorough human review increasingly difficult, raising the risk of safety and security failures. Common approaches, including fuzz testing, static analysis, and LLM-as-a-Verifier, ca","category":"Paper","link":"https://arxiv.org/abs/2609.19391","source":"arXiv AI","badge":"📜"},{"date":"2026-09-18","title":"Closed-World Resolution Against Tool Hallucination in LLM Agents","description":"arXiv:2609.19425v1 Announce Type: new \nAbstract: Tool-augmented large language model (LLM) agents fail in a way no tool-selection or tool-security method addresses: they call tools that do not exist and pass arguments no schema declares. Existing defenses either pick the right tool (selection) or co","category":"Paper","link":"https://arxiv.org/abs/2609.19425","source":"arXiv AI","badge":"📜"},{"date":"2026-09-18","title":"Use ChatGPT Work to ground analysis in your semantic layer","description":"Your data agent needs to understand how your business defines its metrics.\n\nIn this clip, OpenAI’s data team explains how a semantic layer brings together key entities, metric definitions, filters, and known pitfalls. See why expert review matters, how existing semantic work can be reused, and why t","category":"News","link":"https://www.youtube.com/watch?v=bbNTY8O0GTY","source":"YouTube – OpenAI","badge":"🔥"},{"date":"2026-09-18","title":"Use ChatGPT Work to build dashboards from a business question","description":"Start with the question your team needs to answer: how is product adoption changing?\n\nThis ChatGPT Work demo shows a prompt for an adoption dashboard and the prepared result: an interactive funnel, customer segment views, and controls for recurring data refreshes. It uses synthetic data and is edite","category":"News","link":"https://www.youtube.com/watch?v=GzCsKuDgr6Q","source":"YouTube – OpenAI","badge":"🔥"},{"date":"2026-09-18","title":"Use ChatGPT Work to tailor dashboards for every stakeholder","description":"Give stakeholders a view of the business that fits the decisions they need to make.\n\nWatch this ChatGPT Work demo adapt dashboard labels and chart types, explore KPIs, and drill into compute demand. Using synthetic data, it shows ways to tailor dashboards and explore the details behind business perf","category":"News","link":"https://www.youtube.com/watch?v=Wb8MhkpQpX8","source":"YouTube – OpenAI","badge":"🔥"},{"date":"2026-09-18","title":"Use ChatGPT Work to help teams answer their own data questions","description":"Help more people investigate business questions without routing every question through the data team.\n\nIn this clip, OpenAI’s data team explains how building a trustworthy foundation for the data agent helped colleagues explore their own questions. Hear the approach behind making self-service analys","category":"News","link":"https://www.youtube.com/watch?v=euED8JRunBA","source":"YouTube – OpenAI","badge":"🔥"},{"date":"2026-09-18","title":"Use ChatGPT Work to turn product insights into a team action plan","description":"A drop-off in your adoption funnel tells you where to look. Customer feedback helps you investigate why.\n\nSee how usage data and feedback from Slack and Google Drive inform recommendations, then watch ChatGPT Work draft a Slack update for review before posting. This demo uses synthetic data to show ","category":"News","link":"https://www.youtube.com/watch?v=wK0zWeVyLM4","source":"YouTube – OpenAI","badge":"🔥"},{"date":"2026-09-17","title":"Introducing Astra for Law","description":"OpenAI for Law brings frontier intelligence for law, custom firm workflows, connected legal data sources, and legal-grade controls for confidential client work.","category":"News","link":"https://openai.com/index/astra-for-law","source":"OpenAI","badge":"🔥"},{"date":"2026-09-17","title":"10 Cose che Puoi Fare con ChatGPT Images 2.5 (2 Non le Conosce NESSUNO)","description":"ChatGPT Images 2.5 È Arrivato (Tu SCARABOCCHI, Lui Fa il Resto)\n\nChatGPT Images 2.5 è arrivato: disegni uno scarabocchio dentro ChatGPT e lui lo trasforma in una creatività finita. L'ho testato a fondo: ecco cosa funziona davvero e dove si rompe.\n\nOpenAI ha rilasciato ChatGPT Images 2.5 l'8 settembr","category":"News","link":"https://www.youtube.com/watch?v=kQoLREh2GJ8","source":"YouTube - Gabry Solutions","badge":"🔥"},{"date":"2026-09-16","title":"Helping older adults use AI in everyday life","description":"OpenAI and AARP are bringing free, hands-on ChatGPT workshops to 1,000 older adults across 10 U.S. cities to build practical AI skills safely.","category":"News","link":"https://openai.com/index/helping-older-adults-use-ai-in-everyday-life","source":"OpenAI","badge":"🔥"},{"date":"2026-09-16","title":"How to connect AI usage to business value","description":"Learn how ChatGPT Work and Codex analytics help teams understand AI usage and spend, identify training needs, and connect adoption to business outcomes.","category":"News","link":"https://openai.com/index/how-to-connect-ai-usage-to-business-value","source":"OpenAI","badge":"🔥"},{"date":"2025-07-30","title":"Newsletter BitAgora","description":"Selezione articoli IA","category":"Tool","link":"https://newsletter.bitagoraorobica.it/tag/ia/","source":"BitAgorà Orobica","badge":""}];

    const searchInput = document.getElementById('search');
    const categoryFilter = document.getElementById('category');
    const sourceFilter = document.getElementById('source');
    const daysFilter = document.getElementById('days');
    const toggleDark = document.getElementById('toggleDark');
    const resetFilters = document.getElementById('resetFilters');
    const entriesDiv = document.getElementById('entries');

    function createEntry(item) {
      const div = document.createElement('div');
      div.className = 'entry';
      div.dataset.text = (item.title + ' ' + item.description).toLowerCase();
      div.dataset.category = item.category;
      div.dataset.source = item.source;
      div.dataset.date = item.date;
      div.innerHTML = `
        <a href="${item.link}" class="title" target="_blank">
          <span class="badge">${item.badge}</span>${item.title}
        </a>
        <p>${item.description}</p>
        <div class="meta">${item.source} – ${item.date} – ${item.category}</div>
      `;
      return div;
    }

    function render() {
      const q = searchInput.value.toLowerCase();
      const cat = categoryFilter.value;
      const src = sourceFilter.value;
      const days = parseInt(daysFilter.value);
      const now = new Date();

      entriesDiv.innerHTML = "";
entryData.forEach(item => {
  const entryDate = new Date(item.date);
  const diffDays = (now - entryDate) / (1000 * 60 * 60 * 24);
  if (
    (!q || (item.title + item.description).toLowerCase().includes(q)) &&
    (!cat || item.category === cat) &&
    (!src || item.source === src) &&
    (isNaN(days) || diffDays <= days)
  ) {
    const el = createEntry(item);
    entriesDiv.appendChild(el);
    // trigger animazione
    requestAnimationFrame(() => el.classList.add("show"));
  }
});

      
      
    }

    resetFilters.addEventListener("click", () => {
      searchInput.value = "";
      categoryFilter.value = "";
      sourceFilter.value = "";
      daysFilter.value = "";
      render();
    });

    searchInput.addEventListener("input", render);
    categoryFilter.addEventListener("change", render);
    sourceFilter.addEventListener("change", render);
    daysFilter.addEventListener("change", render);
    toggleDark.addEventListener("click", () => document.body.classList.toggle("dark"));

    render();
  </script>
</body>
</html>
